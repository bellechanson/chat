<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
	<th:block th:replace="~{fragments/head :: common('비밀번호 재설정')}"></th:block>
	<link rel="stylesheet" th:href="@{/css/auth.css}">
	<th:block th:replace="~{fragments/head :: csrf}"></th:block>
	<script th:src="@{/js/api.js}"></script>
</head>

<body class="auth-page">
	<main class="auth-card">
		<a th:replace="~{fragments/parts :: brand}"></a>
		실시간 채팅
		</a>

		<h1>비밀번호 재설정</h1>
		<p class="auth-sub">아이디와 가입한 이메일로 인증한 뒤 새 비밀번호를 정해요.</p>

		<form class="auth-form" th:action="@{/reset-password}" method="post">
			<div class="alert alert-error" th:if="${error}" th:text="${error}">에러</div>

			<div>
				<label for="username" class="form-label">아이디</label>
				<input class="field" id="username" name="username" maxlength="20" required autocomplete="username"
					th:value="${username}">
			</div>

			<div>
				<label for="email" class="form-label">가입한 이메일</label>
				<div class="field-row">
					<input class="field" id="email" name="email" type="email" maxlength="100" required
						autocomplete="email" th:value="${email}">
					<button type="button" class="btn" id="sendBtn">인증번호 받기</button>
				</div>
				<div class="field-row hidden" id="codeRow" style="margin-top: 8px">
					<label for="code" class="sr-only">인증번호</label>
					<input class="field" id="code" placeholder="인증번호 6자리" maxlength="6" inputmode="numeric"
						autocomplete="one-time-code">
					<button type="button" class="btn" id="verifyBtn">확인</button>
				</div>
				<p class="hint" id="emailHint">아이디와 가입한 이메일을 입력하세요.</p>
			</div>

			<!-- 인증 후에만 보이는 영역 -->
			<div class="auth-form hidden" id="pwSection" style="margin-top: 0">
				<div>
					<label for="password" class="form-label">새 비밀번호</label>
					<input class="field" id="password" name="password" type="password" maxlength="50"
						autocomplete="new-password">
					<p class="hint">6~50자</p>
				</div>
				<div>
					<label for="passwordConfirm" class="form-label">새 비밀번호 확인</label>
					<input class="field" id="passwordConfirm" name="passwordConfirm" type="password" maxlength="50"
						autocomplete="new-password">
				</div>
				<button type="submit" class="btn btn-primary btn-block">비밀번호 변경</button>
			</div>
		</form>

		<nav class="auth-links">
			<a th:href="@{/login}">로그인</a>
			<a th:href="@{/find-id}">아이디 찾기</a>
		</nav>
	</main>

	<script th:inline="javascript">
		const emailVerified = /*[[${emailVerified}]]*/ false;
		const el = id => document.getElementById(id);

		// 이메일 인증 (api.js의 setupEmailVerify)
		const emailVerify = setupEmailVerify({
			purpose: 'RESET_PASSWORD',
			sendBody: () => {
				const username = el('username').value.trim();
				const email = el('email').value.trim();
				return username && email ? {username, email} : '아이디와 이메일을 입력하세요.';
			},
			onVerified: (r) => {
				setHint(el('emailHint'), r.message, true);
				lockVerified();
			}
		});

		// 인증이 끝나면 아이디·이메일을 고정하고 새 비밀번호 입력칸을 보여 줌
		function lockVerified() {
			emailVerify.stop();
			el('username').readOnly = true;
			el('email').readOnly = true;
			el('sendBtn').disabled = true;
			el('sendBtn').textContent = '인증 완료';
			el('codeRow').classList.add('hidden');
			el('pwSection').classList.remove('hidden');
			el('password').focus();
		}

		if (emailVerified) {
			lockVerified();
			setHint(el('emailHint'), '이메일 인증이 완료되었습니다.', true);
		}
	</script>
</body>

</html>
