<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
	<th:block th:replace="~{fragments/head :: common(${room.name})}"></th:block>
	<link rel="stylesheet" th:href="@{/css/chat.css}">
	<th:block th:replace="~{fragments/head :: csrf}"></th:block>
	<th:block th:replace="~{fragments/head :: realtime}"></th:block>
	<script th:src="@{/js/messages.js}"></script>
	<script th:src="@{/js/lightbox.js}"></script>
	<script th:src="@{/js/api.js}"></script>
	<script th:src="@{/js/files.js}"></script>
	<script th:src="@{/js/mute.js}"></script>
	<script th:src="@{/js/panel.js}"></script>
	<script th:src="@{/js/search.js}"></script>
	<script th:src="@{/js/gallery.js}"></script>
</head>

<body>
	<div class="shell">
		<nav th:replace="~{fragments/sidebar :: sidebar('room', ${room.id})}"></nav>

		<main class="pane">
			<header class="pane-header">
				<div class="room-title">
					<h1><span class="hash">#</span> <span th:text="${room.name}">자유방</span></h1>
					<span class="sub" id="memberNames"></span>
				</div>
				<div class="header-actions">
					<div class="avatar-stack" id="avatarStack" aria-hidden="true"></div>
					<!-- 사진 모아보기 (gallery.js) -->
					<button type="button" class="btn btn-sm" id="galleryBtn" title="이 대화의 사진 모아보기">사진</button>
					<!-- 이 대화에서 찾기 (search.js, Ctrl+F) -->
					<button type="button" class="btn btn-sm" id="searchBtn" title="이 대화에서 찾기 (Ctrl+F)">검색</button>
					<!-- 이 방 알림 끄기/켜기 (mute.js) -->
					<button type="button" class="btn btn-sm mute-btn" id="muteBtn" aria-haspopup="menu">알림 켜짐</button>
					<button type="button" class="btn btn-sm" id="usersBtn" aria-expanded="false"
						aria-controls="usersPop">접속자 <span id="userCount">0</span></button>
					<form id="deleteForm" th:if="${canManage}" th:action="@{/rooms/{id}/delete(id=${room.id})}"
						method="post" data-confirm="방을 삭제할까요?\n모든 대화 내용이 함께 삭제되며 되돌릴 수 없습니다." data-confirm-ok="삭제"
						data-danger>
						<button type="submit" class="btn btn-sm btn-danger">방 삭제</button>
					</form>
					<div class="users-pop hidden" id="usersPop">
						<h2>지금 이 방에 있는 사람</h2>
						<ul id="userList"></ul>
					</div>
				</div>
			</header>

			<form id="dmForm" th:action="@{/dm/start}" method="post" hidden>
				<input type="hidden" name="nickname" id="dmNickname">
			</form>

			<div id="messages" class="messages"></div>

			<div th:replace="~{fragments/parts :: composer(placeholder=${'#' + room.name + '에 메시지 보내기'})}"></div>
		</main>
	</div>

	<script th:inline="javascript">
		const roomId = /*[[${room.id}]]*/ 0;
		const nickname = /*[[${nickname}]]*/ '';
		const canManage = /*[[${canManage}]]*/ false;    // 방장 또는 관리자
		const ownerNickname = /*[[${ownerNickname}]]*/ null;

		const el = id => document.getElementById(id);
		const myId = sidebarInfo()?.myId;   // 내 id (반응 칩에서 내가 누른 것 표시용, sidebar.js)

		let client = null;
		let leaving = false;


		// 보내기·반응·수정·삭제를 서버로 (messages.js의 messageActions)
		const actions = messageActions({
			getClient: () => client, base: `/app/chat/${roomId}`, audience: '모든 사람의 화면에서'
		});

		// ── 메시지 목록 (이전 대화 더보기, 날짜 구분선, 스크롤 → messages.js) ──
		const list = createMessageList({
			box: el('messages'),
			fetchPage: async (before) => {
				const res = await fetch(before
					? `/api/rooms/${roomId}/messages?before=${before}`
					: `/api/rooms/${roomId}/messages`);
				return res.ok ? res.json() : null;
			},
			build: buildMessage,
			divider: () => buildMessage({type: 'ENTER', content: '여기까지 이전 대화'})
		});

		// 접속자 목록용 아바타 (나는 주황, 다른 사람은 이름별 색)
		function avatarEl(name, extraClass) {
			const span = document.createElement('span');
			span.className = 'avatar ' + (name === nickname ? 'avatar-accent' : 'av-' + tintOf(name))
				+ (extraClass ? ' ' + extraClass : '');
			span.textContent = initialOf(name);
			return span;
		}

		// ── 실시간 메시지 처리 ──

		// 방에 있는 동안 받은 메시지는 바로 읽음 (사이드바 뱃지가 남지 않게)
		function markRoomRead() {
			if (client && client.connected) {
				client.publish({destination: `/app/chat/${roomId}/read`});
			}
		}

		function handleMessage(msg) {
			if (msg.type === 'KICK' && msg.sender === nickname) {
				return forceLeave('방장에 의해 강퇴되었습니다.', '/rooms?kicked');
			}
			if (msg.type === 'ROOM_DELETED') {
				return forceLeave('채팅방이 삭제되었습니다.', '/rooms?deleted');
			}
			if (msg.type === 'MESSAGE_DELETED') {
				const target = list.find(msg.id);
				if (target) markDeleted(target);   // 수정하던 메시지면 수정창도 닫힘
				updateQuotes(msg.id, null);        // 이 메시지를 인용한 답장들 → "삭제된 메시지입니다"
				composer.cancelReplyIf(msg.id);    // 이 메시지에 답장 쓰던 중이면 닫기
				search.onDeleted(msg.id);          // 검색 결과에서도 빠짐
				gallery.onDeleted(msg.id);         // 사진 모아보기에서도 빠짐
				return;
			}
			if (msg.type === 'MESSAGE_EDITED') {
				const target = list.find(msg.id);
				if (target) markEdited(target, msg.content, msg.editedAt, msg.mentions);   // 알림·안 읽은 수는 그대로
				updateQuotes(msg.id, quotePreview(plainContent(msg.content, msg.mentions)));   // 인용 글도 새 내용으로
				search.onEdited(msg.id, msg.content, msg.mentions);   // 검색 결과도 새 내용으로 (검색어가 빠지면 빠짐)
				return;
			}
			if (msg.type === 'PHOTOS_CHANGED') {
				const target = list.find(msg.id);
				if (target) setAlbum(target, msg.photos);   // 묶음에서 한 장이 지워짐 → 남은 사진으로
				gallery.onPhotosChanged(msg.id, msg.photos);   // 모아보기에서도 그 사진만 빠짐
				return;
			}

			// 메시지를 보냈거나 나갔으면 그 사람의 "입력 중" 끝
			if (msg.sender && typers.has(msg.sender)) removeTyper(msg.sender);

			list.append(buildMessage(msg), msg.sender === nickname, msg.date);
			search.onMessage(msg);   // 검색 패널을 열어 둔 동안 검색어와 맞으면 결과 맨 위에
			gallery.onMessage(msg);  // 사진 모아보기를 열어 둔 동안 새 사진이면 맨 위에

			if (msg.id) markRoomRead();   // 저장된 메시지(글·사진·파일)면 읽음 처리
		}

		async function forceLeave(text, url) {
			if (leaving) return;
			leaving = true;
			await leave();
			await showAlert(text);   // dialog.js — [확인]을 누르면 이동
			location.href = url;
		}

		// 메시지 하나: 입장·퇴장·강퇴는 가운데 안내, 나머지는 한 줄 (messages.js의 messageLine)
		function buildMessage(msg) {
			if (msg.type === 'ENTER' || msg.type === 'LEAVE' || msg.type === 'KICK') {
				const p = document.createElement('p');
				p.className = 'notice' + (msg.type === 'KICK' ? ' kick' : '');
				p.textContent = msg.content;
				return p;
			}

			const mine = msg.sender === nickname;
			return messageLine({
				id: msg.id,
				name: msg.sender,
				mine,
				time: msg.time,
				content: msg.content,
				file: msg.file,
				deleted: msg.deleted,
				editedAt: msg.editedAt,
				reactions: msg.reactions,
				myId,
				// 저장된 메시지면 누구나 반응 (같은 걸 다시 누르면 취소, 다른 걸 누르면 바뀜)
				onReact: msg.id ? (emoji) => actions.react(msg.id, emoji) : null,
				// 내 글 메시지만 고칠 수 있음 (방장·관리자도 남의 메시지는 못 고침)
				onEdit: msg.id && mine ? (text) => actions.edit(msg.id, text) : null,
				// 내 메시지, 또는 방장·관리자는 지울 수 있음
				onDelete: msg.id && (mine || canManage) ? () => actions.remove(msg.id) : null,
				// 사진 묶음: 지울 수 있는 사람은 한 장씩도 지울 수 있음
				photos: msg.photos,
				onDeletePhoto: msg.id && (mine || canManage) ? (photoId) => actions.removePhoto(msg.id, photoId) : null,
				onImageLoad: list.keepBottom,
				// 답장: 원래 메시지 인용(누르면 이동), [답장] 버튼, @멘션, 나를 부른 메시지 표시
				reply: msg.reply,
				onJump: (id) => list.jumpTo(id, '원래 메시지를 찾을 수 없어요.'),
				mentions: msg.mentions || {},
				repliesToMe: !!msg.reply && !msg.reply.deleted && msg.reply.sender === nickname,
				onReply: msg.id ? () => composer.replyTo({
					id: msg.id, sender: msg.sender, preview: plainContent(msg.content, msg.mentions)
				}) : null
			});
		}


		// 반응이 바뀜 (누가 누르거나 취소) → 그 메시지의 칩 전체를 새로 그림
		function onReactions(e) {
			const target = list.find(e.messageId);
			if (target && !target.classList.contains('deleted')) setReactions(target, e.reactions);
		}


		// ── 입력 중 표시 (사진·파일을 올리는 중이면 "○○님이 사진 12장을 보내는 중") ──
		const TYPING_SHOW_MS = 4000;   // 신호가 이 시간 동안 안 오면 그 사람은 목록에서 뺌
		const typers = new Map();      // 입력 중인 사람: 닉네임 → { timer: 숨김 타이머, upload: "사진 12장" 또는 "" }


		function onTyping(e) {
			if (e.nickname === nickname) return;   // 내 신호는 무시
			if (!e.typing) return removeTyper(e.nickname);

			clearTimeout(typers.get(e.nickname)?.timer);
			typers.set(e.nickname, {
				timer: setTimeout(() => removeTyper(e.nickname), TYPING_SHOW_MS),
				upload: uploadLabel(e.photos, e.files)   // files.js
			});
			renderTyping();
		}

		function removeTyper(name) {
			clearTimeout(typers.get(name)?.timer);
			typers.delete(name);
			renderTyping();
		}

		// 1명: 철수님이 / 2명: 철수, 영희님이 / 3명 이상: 철수 외 2명이
		// 올리는 사람이 있으면 그 사람 먼저: 철수님이 사진 12장을 보내는 중 (외 1명 입력 중)
		function renderTyping() {
			const names = [...typers.keys()];
			if (names.length === 0) {
				el('typing').classList.remove('on');
				return;
			}
			const uploader = names.find(name => typers.get(name).upload);
			el('typingText').textContent = uploader
				? `${uploader}님이 ${typers.get(uploader).upload}을 보내는 중`
				+ (names.length > 1 ? ` (외 ${names.length - 1}명 입력 중)` : '')
				: names.length === 1 ? `${names[0]}님이 입력 중`
					: names.length === 2 ? `${names[0]}, ${names[1]}님이 입력 중`
						: `${names[0]} 외 ${names.length - 1}명이 입력 중`;
			el('typing').classList.add('on');
		}

		// ── 접속자: 머리의 이름·아바타 + [접속자] 펼침 목록 ──
		function renderUsers(users) {
			// 방에서 나간 사람은 "입력 중"에서도 뺌
			[...typers.keys()].filter(name => !users.includes(name)).forEach(removeTyper);

			const sorted = [...users].sort((a, b) => (b === nickname) - (a === nickname));
			el('userCount').textContent = users.length;
			el('memberNames').textContent = sorted.join(', ');

			const stack = el('avatarStack');
			stack.innerHTML = '';
			sorted.slice(0, 3).forEach(name => stack.appendChild(avatarEl(name)));

			const ul = el('userList');
			ul.innerHTML = '';
			sorted.forEach(name => {
				const li = document.createElement('li');
				li.className = 'user-row' + (name === nickname ? ' me' : '');
				li.appendChild(avatarEl(name, 'avatar-sm'));

				const label = document.createElement('span');
				label.className = 'name';
				label.textContent = name + (name === nickname ? ' (나)' : '');
				li.appendChild(label);

				if (name === ownerNickname) {
					const tag = document.createElement('span');
					tag.className = 'tag';
					tag.textContent = '방장';
					li.appendChild(tag);
				}
				if (name !== nickname) {
					const dmBtn = document.createElement('button');
					dmBtn.type = 'button';
					dmBtn.className = 'mini-btn';
					dmBtn.textContent = '1:1';
					dmBtn.onclick = () => startDm(name);
					li.appendChild(dmBtn);
				}
				if (canManage && name !== nickname) {
					const kickBtn = document.createElement('button');
					kickBtn.type = 'button';
					kickBtn.className = 'mini-btn danger';
					kickBtn.textContent = '강퇴';
					kickBtn.onclick = () => kick(name);
					li.appendChild(kickBtn);
				}
				ul.appendChild(li);
			});
		}

		// [접속자] 펼치기/닫기 (바깥 클릭, Esc로 닫기 — sidebar.js의 closeOnOutside)
		function setUsersOpen(open) {
			el('usersPop').classList.toggle('hidden', !open);
			el('usersBtn').setAttribute('aria-expanded', open);
		}
		el('usersBtn').addEventListener('click', () => {
			setUsersOpen(el('usersPop').classList.contains('hidden'));
		});
		closeOnOutside(el('usersPop'), () => setUsersOpen(false),
			{ignore: t => el('usersBtn').contains(t)});   // [접속자] 버튼은 직접 열고 닫음

		async function kick(name) {
			if (!await askConfirm(`${name}님을 강퇴할까요?\n강퇴되면 이 방에 다시 들어올 수 없습니다.`,
				{ok: '강퇴', danger: true})) return;   // dialog.js
			client.publish({
				destination: `/app/chat/${roomId}/kick`,
				body: JSON.stringify({target: name})
			});
		}

		async function startDm(name) {
			leaving = true;
			await leave();
			el('dmNickname').value = name;
			el('dmForm').submit();
		}

		// ── 나가기 ──
		async function leave() {
			if (client && client.active) {
				await client.deactivate();
			}
		}

		// ── 이 대화에서 찾기 (search.js): 오른쪽 패널, 결과를 누르면 그 메시지로 ──
		const search = setupSearch({
			button: el('searchBtn'), pane: document.querySelector('main.pane'),
			searchUrl: `/api/rooms/${roomId}/search`, list
		});

		// ── 사진 모아보기 (gallery.js): 오른쪽 패널, 누르면 크게 보기 ──
		const gallery = setupGallery({
			button: el('galleryBtn'), pane: document.querySelector('main.pane'),
			mediaUrl: `/api/rooms/${roomId}/media`
		});

		// ── 보내기 · 입력 중 신호 · 답장 · @ 이름 고르기 (messages.js의 setupComposer) ──
		const composer = setupComposer({
			input: el('content'), sendButton: el('sendBtn'), actions,
			loadMembers: async () => {   // 이 방에 들어와 본 사람 (나 빼고)
				const res = await fetch(`/api/rooms/${roomId}/members`);
				return res.ok ? (await res.json()).filter(u => u.id !== myId) : [];
			}
		});

		// [첨부] 버튼, 붙여넣기, 끌어다 놓기 (files.js) — 사진은 묶음으로, 올리는 동안 방 사람들에게 "보내는 중"
		setupAttach({
			button: el('attachBtn'),
			input: el('fileInput'),
			textInput: el('content'),
			uploadUrl: `/api/rooms/${roomId}/files`,
			photoUrl: `/api/rooms/${roomId}/photos`,
			onUploading: actions.uploading
		});

		const deleteForm = el('deleteForm');
		if (deleteForm) {
			// 확인(data-confirm, dialog.js)을 받은 뒤에만 불림 → 나가는 중 표시
			deleteForm.addEventListener('submit', () => {
				leaving = true;
			});
		}

		// ── 이 방 알림 끄기 (mute.js) ──
		const mute = setupMute({button: el('muteBtn'), scope: 'ROOM', targetId: roomId, url: `/api/rooms/${roomId}/mute`});

		// ── 실시간 연결 (이 방은 뱃지 셈에서 제외) ──
		client = connectSocket(async (c) => {
			mute.watch(c);
			await list.loadFirst();
			c.subscribe(`/topic/room/${roomId}`, f => handleMessage(JSON.parse(f.body)));
			c.subscribe(`/topic/room/${roomId}/users`, f => renderUsers(JSON.parse(f.body)));
			c.subscribe(`/topic/room/${roomId}/typing`, f => onTyping(JSON.parse(f.body)));
			c.subscribe(`/topic/room/${roomId}/reactions`, f => onReactions(JSON.parse(f.body)));
			// 누가 닉네임을 바꾸거나 탈퇴 → @멘션 글자를 새 이름으로
			c.subscribe('/topic/nickname', f => {
				const e = JSON.parse(f.body);
				renameMentions(e.userId, e.nickname);
				search.onRenamed(e.oldNickname, e.nickname);   // 검색 결과의 보낸 사람 이름도
				gallery.onRenamed(e.oldNickname, e.nickname);  // 모아보기 사진의 보낸 사람 이름도
			});
			c.publish({destination: `/app/chat/${roomId}/enter`});
			el('content').focus();
		}, roomId);
	</script>
</body>

</html>
