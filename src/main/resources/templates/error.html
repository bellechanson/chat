<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
	<th:block th:replace="~{fragments/head :: common(${status})}"></th:block>
	<link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body class="auth-page">
	<main class="auth-card error-card">
		<a th:replace="~{fragments/parts :: brand}"></a>
		실시간 채팅
		</a>

		<!-- status: 스프링이 넘겨주는 오류 번호 (403, 404, 500 …) -->
		<div th:switch="${#strings.toString(status)}">
			<div class="error-code" th:text="${status}">404</div>

			<th:block th:case="'403'">
				<h1>접근 권한이 없습니다</h1>
				<p class="auth-sub">이 화면을 볼 수 있는 권한이 없어요. 관리자 화면이라면 관리자에게 문의해 주세요.</p>
			</th:block>

			<th:block th:case="'404'">
				<h1>페이지를 찾을 수 없습니다</h1>
				<p class="auth-sub">주소가 잘못되었거나 삭제된 화면이에요.</p>
			</th:block>

			<th:block th:case="'500'">
				<h1>서버에 문제가 생겼습니다</h1>
				<p class="auth-sub">잠시 후 다시 시도해 주세요. 문제가 계속되면 관리자에게 알려 주세요.</p>
			</th:block>

			<th:block th:case="*">
				<h1>요청을 처리할 수 없습니다</h1>
				<p class="auth-sub">잘못된 요청이에요. 주소를 확인하고 다시 시도해 주세요.</p>
			</th:block>
		</div>

		<div class="error-actions">
			<button type="button" class="btn" id="backBtn">뒤로 가기</button>
			<a class="btn btn-primary" th:href="@{/rooms}">메인 화면으로</a>
		</div>
	</main>

	<script>
		// 이전 화면이 없으면(주소를 직접 열었을 때) 뒤로 가기 버튼 숨김
		const backBtn = document.getElementById('backBtn');
		if (history.length <= 1) backBtn.classList.add('hidden');
		backBtn.onclick = () => history.back();
	</script>
</body>

</html>
