<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
	<th:block th:replace="~{fragments/head :: common(${partnerNickname})}"></th:block>
	<link rel="stylesheet" th:href="@{/css/chat.css}">
	<th:block th:replace="~{fragments/head :: csrf}"></th:block>
	<th:block th:replace="~{fragments/head :: realtime}"></th:block>
	<script th:src="@{/js/messages.js}"></script>
	<script th:src="@{/js/lightbox.js}"></script>
	<script th:src="@{/js/api.js}"></script>
	<script th:src="@{/js/files.js}"></script>
</head>

<body>
	<div class="shell">
		<nav th:replace="~{fragments/sidebar :: sidebar('dm', ${conversationId})}"></nav>

		<main class="pane">
			<header class="pane-header">
				<div class="dm-head">
					<span class="avatar" th:classappend="'av-' + ${partnerTint}"><span
							th:text="${partnerInitial}">영</span><span class="presence" id="partnerDot"
							th:classappend="${partnerOnline} ? 'on'"></span></span>
					<div>
						<h1 th:text="${partnerNickname}">영희</h1>
						<span class="dm-status" id="partnerStatus" th:classappend="${partnerOnline} ? 'on'"
							th:text="${partnerGone} ? '대화할 수 없는 사용자' : (${partnerOnline} ? '접속 중' : '오프라인')">접속 중</span>
					</div>
				</div>
				<div class="header-actions">
					<!-- 내 목록에서만 사라짐 (sidebar.js leaveDm) -->
					<button type="button" class="btn btn-sm" id="leaveBtn">대화방 나가기</button>
				</div>
			</header>

			<div id="messages" class="messages"></div>

			<!-- 상대가 탈퇴했으면 입력칸 대신 안내 (th:replace가 th:if보다 먼저 처리되므로 th:block으로 감쌈) -->
			<th:block th:unless="${partnerGone}">
				<div th:replace="~{fragments/parts :: composer(placeholder=${partnerNickname + '님에게 메시지 보내기'})}"></div>
			</th:block>
			<div class="composer" th:if="${partnerGone}">
				<p class="composer-closed">탈퇴한 사용자와는 더 이상 대화할 수 없어요. 이전 대화는 그대로 볼 수 있고, [대화방 나가기]로 목록에서 정리할 수 있어요.</p>
			</div>
		</main>
	</div>

	<script th:inline="javascript">
		const convId = /*[[${conversationId}]]*/ 0;
		const myId = /*[[${myId}]]*/ 0;
		const partnerId = /*[[${partnerId}]]*/ 0;
		const partnerName = /*[[${partnerNickname}]]*/ '';
		const canSend = !/*[[${partnerGone}]]*/ false;   // 상대가 탈퇴했으면 입력칸이 없음

		const el = id => document.getElementById(id);

		let client = null;

		// ── 메시지 목록 (이전 대화 더보기, 날짜 구분선, 스크롤 → messages.js) ──
		const list = createMessageList({
			box: el('messages'),
			fetchPage: async (before) => {
				const res = await fetch(before
					? `/api/dm/${convId}/messages?before=${before}`
					: `/api/dm/${convId}/messages`);
				return res.ok ? res.json() : null;
			},
			build: buildMessage
		});

		// ── 읽음 처리: 화면을 보고 있을 때만 ──
		function markRead() {
			if (client && client.connected && document.visibilityState === 'visible') {
				client.publish({destination: `/app/dm/${convId}/read`});
			}
		}

		// 다른 탭을 보다가 돌아오면 읽음 처리
		document.addEventListener('visibilitychange', markRead);

		// ── 받은 메시지 ──
		function onMessage(m) {
			if (m.conversationId !== convId) return;   // 다른 대화는 무시

			const mine = m.senderId === myId;
			if (!mine) hideTyping();                   // 메시지가 왔으니 "입력 중" 끝

			list.append(buildMessage(m), mine, m.date);

			if (!mine) markRead();                     // 보고 있으니 바로 읽음
		}

		// 상대가 읽었음 → 내 메시지의 "1" 모두 제거
		function onRead(e) {
			if (e.conversationId !== convId || e.readerId === myId) return;
			el('messages').querySelectorAll('.read-mark').forEach(mark => mark.remove());
		}

		// 삭제 신호 (내 다른 탭, 상대 화면 모두) — 수정하던 메시지면 수정창도 닫힘
		function onDeleted(e) {
			if (e.conversationId !== convId) return;
			const target = list.find(e.messageId);
			if (target) markDeleted(target);
		}

		// 수정 신호 (내 다른 탭, 상대 화면 모두): 내용 교체 + "(수정됨)", 알림·안 읽은 수는 그대로
		function onEdited(e) {
			if (e.conversationId !== convId) return;
			const target = list.find(e.messageId);
			if (target) markEdited(target, e.content, e.editedAt);
		}

		// 상대 접속 상태 (머리의 초록 점, "접속 중"/"오프라인")
		function onOnline(ids) {
			if (!canSend) return;   // 탈퇴한 상대는 표시 고정
			const on = ids.map(String).includes(String(partnerId));
			el('partnerDot').classList.toggle('on', on);
			el('partnerStatus').classList.toggle('on', on);
			el('partnerStatus').textContent = on ? '접속 중' : '오프라인';
		}

		// ── 메시지 하나 (messages.js의 messageLine) ──
		function buildMessage(m) {
			const mine = m.senderId === myId;
			return messageLine({
				id: m.id,
				name: m.senderNickname,
				mine,
				time: m.time,
				content: m.content,
				file: m.file,
				deleted: m.deleted,
				editedAt: m.editedAt,
				reactions: m.reactions,
				myId,
				onReact: canSend ? (emoji) => react(m.id, emoji) : null,   // 누구 메시지든 반응 (상대 탈퇴 시 보기만)
				unread: mine && !m.read,                                // 상대가 안 읽은 내 메시지에 "1"
				onEdit: mine && canSend ? (text) => editMessage(m.id, text) : null,   // 내 글 메시지만 (상대 탈퇴 시 막힘)
				onDelete: mine ? () => deleteMessage(m.id) : null,      // DM은 내 메시지만 삭제 가능
				photos: m.photos,                                       // 사진 묶음
				onDeletePhoto: mine ? (photoId) => deletePhoto(m.id, photoId) : null,   // 내 묶음에서 한 장씩
				onImageLoad: list.keepBottom
			});
		}

		function react(id, emoji) {
			if (!client || !client.connected) return;
			client.publish({
				destination: `/app/dm/${convId}/react`,
				body: JSON.stringify({id, emoji})
			});
		}

		// 반응이 바뀜 (나·상대·내 다른 탭) → 그 메시지의 칩 전체를 새로 그림
		function onReactions(e) {
			if (e.conversationId !== convId) return;
			const target = list.find(e.messageId);
			if (target && !target.classList.contains('deleted')) setReactions(target, e.reactions);
		}

		function editMessage(id, content) {
			if (!client || !client.connected) return;
			client.publish({
				destination: `/app/dm/${convId}/edit`,
				body: JSON.stringify({id, content})
			});
		}

		function deleteMessage(id) {
			if (!confirm('메시지를 삭제할까요?\n상대 화면에서도 "삭제된 메시지입니다"로 바뀝니다.')) return;
			client.publish({
				destination: `/app/dm/${convId}/delete`,
				body: JSON.stringify({id})
			});
		}

		// 사진 묶음에서 한 장만 삭제 → 나와 상대 화면에서 그 사진만 빠짐 (마지막 한 장이면 메시지 삭제)
		function deletePhoto(id, photoId) {
			if (!client || !client.connected) return;
			if (!confirm('이 사진만 삭제할까요?\n상대 화면에서도 이 사진이 빠집니다.')) return;
			client.publish({
				destination: `/app/dm/${convId}/delete-photo`,
				body: JSON.stringify({id, photoId: Number(photoId)})
			});
		}

		// 묶음에서 사진이 지워짐 (나·상대·내 다른 탭) → 남은 사진으로 다시 그림
		function onPhotos(e) {
			if (e.conversationId !== convId) return;
			const target = list.find(e.messageId);
			if (target) setAlbum(target, e.photos);
		}

		// ── 대화방 나가기 (sidebar.js의 leaveDm: 확인 후 나가고 홈으로) ──
		el('leaveBtn').addEventListener('click', () => leaveDm(convId, partnerName));

		// ── 입력 중 표시 ──
		const TYPING_SHOW_MS = 4000;   // 신호가 이 시간 동안 안 오면 숨김
		let typingHideTimer = null;

		function onTyping(e) {
			if (e.conversationId !== convId || !el('typing')) return;
			if (!e.typing) return hideTyping();

			// 사진·파일을 올리는 중이면 "○○님이 사진 12장을 보내는 중" (files.js의 uploadLabel)
			const upload = uploadLabel(e.photos, e.files);
			el('typingText').textContent = upload ? `${e.nickname}님이 ${upload}을 보내는 중` : `${e.nickname}님이 입력 중`;
			el('typing').classList.add('on');
			clearTimeout(typingHideTimer);
			typingHideTimer = setTimeout(hideTyping, TYPING_SHOW_MS);
		}

		function hideTyping() {
			clearTimeout(typingHideTimer);
			el('typing')?.classList.remove('on');
		}

		// ── 보내기 · 입력 중 신호 · 첨부 (상대가 탈퇴했으면 입력칸이 없으니 건너뜀) ──
		if (canSend) {
			// 내가 입력할 때 신호 보내기 (2초 간격 → messages.js)
			const typing = watchTyping(el('content'), (on) => {
				if (!client || !client.connected) return;
				client.publish({
					destination: `/app/dm/${convId}/typing`,
					body: JSON.stringify({typing: on})
				});
			});

			function sendMessage() {
				const input = el('content');
				const content = input.value.trim();
				if (!content || !client || !client.connected) return;

				client.publish({
					destination: `/app/dm/${convId}/send`,
					body: JSON.stringify({content})
				});
				input.value = '';
				input.focus();
				typing.sent();
			}

			el('sendBtn').onclick = sendMessage;
			el('content').addEventListener('keydown', e => {
				if (e.key === 'Enter' && !e.isComposing) sendMessage();
			});

			// [첨부] 버튼, 붙여넣기, 끌어다 놓기 (files.js) — 사진은 묶음으로, 올리는 동안 상대에게 "보내는 중"
			setupAttach({
				button: el('attachBtn'),
				input: el('fileInput'),
				textInput: el('content'),
				uploadUrl: `/api/dm/${convId}/files`,
				photoUrl: `/api/dm/${convId}/photos`,
				onUploading: (photos, files) => {
					if (!client || !client.connected) return;
					client.publish({
						destination: `/app/dm/${convId}/typing`,
						body: JSON.stringify({typing: photos + files > 0, photos, files})
					});
				}
			});
		}

		// ── 실시간 연결 ──
		client = connectSocket(async (c) => {
			await list.loadFirst();
			c.subscribe('/user/queue/dm', f => onMessage(JSON.parse(f.body)));
			c.subscribe('/user/queue/dm-read', f => onRead(JSON.parse(f.body)));
			c.subscribe('/user/queue/dm-typing', f => onTyping(JSON.parse(f.body)));
			c.subscribe('/user/queue/dm-deleted', f => onDeleted(JSON.parse(f.body)));
			c.subscribe('/user/queue/dm-edited', f => onEdited(JSON.parse(f.body)));
			c.subscribe('/user/queue/dm-reactions', f => onReactions(JSON.parse(f.body)));
			c.subscribe('/user/queue/dm-photos', f => onPhotos(JSON.parse(f.body)));
			c.subscribe('/topic/online', f => onOnline(JSON.parse(f.body)));
			markRead();
			el('content')?.focus();
		});
	</script>
</body>

</html>
