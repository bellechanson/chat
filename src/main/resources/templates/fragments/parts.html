<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<body>
	<!--
		여러 화면이 같이 쓰는 조각
		  로고:   <a th:replace="~{fragments/parts :: brand}"></a>
		  입력칸: <div th:replace="~{fragments/parts :: composer(placeholder='안내 문구')}"></div>
	-->

	<!-- 로그인 쪽 화면 · 오류 화면 맨 위 로고 (누르면 메인, 로그인 안 했으면 로그인 화면) -->
	<a th:fragment="brand" class="brand" th:href="@{/}">
		<span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">
				<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path>
			</svg></span>
		실시간 채팅
	</a>

	<!-- 채팅방 · 1:1 대화방 아래 입력칸 (입력 중 표시 + 첨부 + 전송) -->
	<div th:fragment="composer(placeholder)" class="composer">
		<div class="typing" id="typing">
			<span id="typingText"></span><span class="dots"><span>.</span><span>.</span><span>.</span></span>
		</div>
		<div class="composer-box">
			<label for="content" class="sr-only">메시지</label>
			<input id="content" maxlength="1000" autocomplete="off" th:placeholder="${placeholder}">
			<div class="composer-tools">
				<button type="button" class="icon-btn" id="attachBtn" aria-label="사진·파일 보내기"
					title="사진·파일 보내기 (캡처 이미지는 Ctrl+V)">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path
							d="M21.4 11.1l-8.5 8.5a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8">
						</path>
					</svg>
				</button>
				<input type="file" id="fileInput" hidden
					accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.txt,.zip,.hwp,.doc,.docx,.xls,.xlsx,.ppt,.pptx">
				<button type="button" class="send-btn" id="sendBtn" aria-label="전송" title="전송 (Enter)">
					<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M22 2L11 13"></path>
						<path d="M22 2l-7 20-4-9-9-4 20-7z"></path>
					</svg>
				</button>
			</div>
		</div>
	</div>
</body>

</html>
