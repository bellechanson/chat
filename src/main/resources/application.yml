server:
    port: 8081
    servlet:
      session:
        persistent: false   # STS 재시작 시 세션 복원 안 함 (jar 실행과 똑같이)

spring:
    application:
        name: chat

    # 메일·DB 계정은 Windows 환경 변수에서 읽음 (비밀번호를 파일에 두지 않기 위해)
    mail:
        host: smtp.gmail.com
        port: 587
        username: ${CHAT_MAIL_USERNAME}
        password: ${CHAT_MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                    connectiontimeout: 5000
                    timeout: 5000
                    writetimeout: 5000

    datasource:
        url: jdbc:oracle:thin:@localhost:1521:XE
        driver-class-name: oracle.jdbc.OracleDriver
        username: ${CHAT_DB_USERNAME:chatdb}
        password: ${CHAT_DB_PASSWORD}

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        properties:
            hibernate:
                format_sql: false
                dialect: org.hibernate.community.dialect.OracleLegacyDialect

    thymeleaf:
        cache: false
    servlet:
      ultipart:
        max-file-size: 10MB      # 파일 하나 최대
        max-request-size: 11MB   # 요청 전체 최대
chat:
    upload-dir: ${user.home}/chat-uploads