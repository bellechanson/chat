server:
    port: 8081
    servlet:
        session:
            persistent: false # STS 재시작 시 세션 복원 안 함 (jar 실행과 똑같이)

spring:
    application:
        name: chat

    # 메일·DB 계정은 Windows 환경 변수에서 읽음 (비밀번호를 파일에 두지 않기 위해)
    mail:
        host: smtp.gmail.com
        port: 587
        username: ${CHAT_MAIL_USERNAME}
        password: ${CHAT_MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                    connectiontimeout: 5000
                    timeout: 5000
                    writetimeout: 5000

    datasource:
        url: jdbc:oracle:thin:@localhost:1521:XE
        driver-class-name: oracle.jdbc.OracleDriver
        username: ${CHAT_DB_USERNAME:chatdb}
        password: ${CHAT_DB_PASSWORD}

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        properties:
            hibernate:
                format_sql: false
                dialect: org.hibernate.community.dialect.OracleLegacyDialect

    thymeleaf:
        cache: false
    servlet:
        multipart:
            max-file-size: ${chat.upload-max-mb}MB # 파일 하나 최대 (아래 chat.upload-max-mb 값)
            max-request-size: 55MB # 요청 전체 최대 — upload-max-mb보다 5MB 크게 맞춰 둘 것
chat:
    upload-dir: ${user.home}/chat-uploads
    upload-max-mb: 50 # 보낼 수 있는 파일 하나 크기(MB) — 서버 검사·화면 안내·multipart 설정이 모두 이 값을 씀
